name: Build and deploy to GitHub Pages

# Pushes the built dist/ to a gh-pages branch instead of using the
# actions/deploy-pages "environment" flow — that flow requires Pages to
# already be switched to "GitHub Actions" source in repo settings, which
# provisions a github-pages *environment* on first use; until that happens
# any job referencing it fails instantly with zero steps run. Pushing a
# plain branch only needs the default GITHUB_TOKEN with contents: write,
# which works immediately, and pairs with the "Deploy from a branch" mode
# this repo already has active.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
